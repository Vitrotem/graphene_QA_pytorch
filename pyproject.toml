[tool.poetry]
name = "vitrotem-grid-ai"
version = "0.1.0"
description = "Binary classifier for detecting graphene on TEM grid images"
readme = "README.md"
packages = [{ include = "src" }]

[[tool.poetry.source]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
priority = "explicit"

[tool.poetry.dependencies]
python = "^3.11"
torch = { version = "2.5.1", source = "pytorch-cu121" }
torchvision = { version = "0.20.1", source = "pytorch-cu121" }
Pillow = "10.4.0"
numpy = "1.26.4"
scikit-learn = "1.5.2"
tqdm = "4.66.5"
opencv-python-headless = "4.10.0.84"

[tool.poetry.scripts]
vt-train = "src.train:main"
vt-eval = "src.evaluate:main"
vt-predict = "src.predict:main"
vt-preprocess = "src.preprocess:main"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
